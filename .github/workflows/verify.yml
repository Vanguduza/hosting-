name: Verify repository contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/packcheck.py
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q services/api agents/node-agent tools
      - run: python -c 'import sys; sys.path.insert(0,"services/api"); import hosting_api.__main__'
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_SETUP_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      TEST_ADMIN_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/hosting_ci
      TEST_API_DSN: postgresql://hosting_api:api-test-password@127.0.0.1:5432/hosting_ci
      TEST_WORKER_DSN: postgresql://hosting_worker:worker-test-password@127.0.0.1:5432/hosting_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: python tests/setup_database.py
      - run: python -m unittest tests.test_database_integration -v
  postgres-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: docker pull postgres:17
      - run: docker pull valkey/valkey:9
      - run: |
          echo "POSTGRES_RUNTIME_IMAGE=postgres:17@sha256:$(docker image inspect postgres:17 --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
          echo "VALKEY_RUNTIME_IMAGE=valkey/valkey:9@sha256:$(docker image inspect valkey/valkey:9 --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
      - run: docker run -d --name dial-pg-ci-registry -p 127.0.0.1:5000:5000 registry:3
      - run: docker build -t 127.0.0.1:5000/dial-ci/pg-web:test tests/fixtures/web
      - run: docker push 127.0.0.1:5000/dial-ci/pg-web:test
      - run: echo "POSTGRES_RUNTIME_WEB_IMAGE=$(docker image inspect 127.0.0.1:5000/dial-ci/pg-web:test --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_postgres_runtime -v
        env:
          POSTGRES_RUNTIME_BACKUP: '1'
  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker run -d --name dial-ci-registry -p 127.0.0.1:5000:5000 registry:3
      - run: docker build -t 127.0.0.1:5000/dial-ci/web:test tests/fixtures/web
      - run: docker push 127.0.0.1:5000/dial-ci/web:test
      - run: echo "NODE_RUNTIME_TEST_IMAGE=$(docker image inspect 127.0.0.1:5000/dial-ci/web:test --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_docker_runtime -v
      - run: python -m unittest tests.test_ingress_runtime -v
        env:
          INGRESS_TEST_IMAGE: traefik:v3.5
  openbao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: python -m unittest tests.test_openbao_integration -v
        env:
          OPENBAO_TEST_IMAGE: openbao/openbao:2.6.0
  valkey-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker pull valkey/valkey:9
      - run: |
          echo "VALKEY_RUNTIME_IMAGE=valkey/valkey:9@sha256:$(docker image inspect valkey/valkey:9 --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
      - run: docker run -d --name dial-vk-ci-registry -p 127.0.0.1:5000:5000 registry:3
      - run: docker build -t 127.0.0.1:5000/dial-ci/vk-web:test tests/fixtures/web
      - run: docker push 127.0.0.1:5000/dial-ci/vk-web:test
      - run: echo "VALKEY_RUNTIME_WEB_IMAGE=$(docker image inspect 127.0.0.1:5000/dial-ci/vk-web:test --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_valkey_runtime -v
