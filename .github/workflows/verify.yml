name: Verify repository contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compose-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/compose_startup.sh
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/packcheck.py
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: python -m pip install --requirement services/api/requirements-contracts.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps ./sdk/python --wheel-dir /tmp/dial-sdk-wheel
      - run: python -m compileall -q services/api agents/node-agent tools sdk/python
      - run: sh -n deploy/control/install-audit-checkpoint.sh
      - run: sh -n deploy/control/install-release-health-check.sh
      - run: python -c 'import sys; sys.path.insert(0,"services/api"); import hosting_api.__main__'
      - run: docker compose -f deploy/control/compose.yaml -f deploy/control/worker.compose.yaml config --quiet
        env:
          OIDC_ISSUER: https://issuer.example.org
          OIDC_AUDIENCE: dial-hosting-ci
          OIDC_SERVICE_AUDIENCE: dial-hosting-service-ci
          OIDC_JWKS_URL: https://issuer.example.org/jwks
          BAO_ADDR: https://bao.example.org
  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_SETUP_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/postgres
      TEST_ADMIN_DSN: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/hosting_ci
      TEST_API_DSN: postgresql://hosting_api:api-test-password@127.0.0.1:5432/hosting_ci
      TEST_WORKER_DSN: postgresql://hosting_worker:worker-test-password@127.0.0.1:5432/hosting_ci
      TEST_ADMITTER_DSN: postgresql://hosting_admitter:admitter-test-password@127.0.0.1:5432/hosting_ci
      TEST_HOOK_DSN: postgresql://hosting_hook:hook-test-password@127.0.0.1:5432/hosting_ci
      TEST_BUILDWORKER_DSN: postgresql://hosting_buildworker:buildworker-test-password@127.0.0.1:5432/hosting_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: docker pull postgres:17
      - run: |
          pg_ci_container=$(docker ps -q --filter ancestor=postgres:17)
          test -n "$pg_ci_container"
          docker exec -u postgres "$pg_ci_container" sh -c \
            'printf "host replication postgres 0.0.0.0/0 scram-sha-256\n" >> /var/lib/postgresql/data/pg_hba.conf'
          docker exec -u postgres "$pg_ci_container" pg_ctl -D /var/lib/postgresql/data reload
      - run: |
          mkdir -p /tmp/dial-pg-client
          cat > /tmp/dial-pg-client/psql <<'SH'
          #!/bin/sh
          exec docker run --rm --network=host --user "$(id -u):$(id -g)" \
            --mount type=bind,src=/tmp,dst=/tmp \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSFILE \
            postgres:17 "$(basename "$0")" "$@"
          SH
          chmod 755 /tmp/dial-pg-client/psql
          for command in pg_dump pg_restore pg_basebackup createdb dropdb; do
            ln -s psql "/tmp/dial-pg-client/$command"
          done
          echo /tmp/dial-pg-client >> "$GITHUB_PATH"
      - run: echo "CONTROL_POSTGRES_IMAGE=$(docker image inspect postgres:17 --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python tests/setup_database.py
      - run: python -m unittest tests.test_database_integration -v
      - run: python -m unittest tests.test_control_backup_runtime -v
        env:
          CONTROL_RUNTIME_BACKUP: '1'
  postgres-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: docker pull postgres:17
      - run: docker pull valkey/valkey:9
      - run: |
          echo "POSTGRES_RUNTIME_IMAGE=postgres:17@sha256:$(docker image inspect postgres:17 --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
          echo "VALKEY_RUNTIME_IMAGE=valkey/valkey:9@sha256:$(docker image inspect valkey/valkey:9 --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
      - run: docker run -d --name dial-pg-ci-registry -p 127.0.0.1:5000:5000 registry:3
      - run: docker build -t 127.0.0.1:5000/dial-ci/pg-web:test tests/fixtures/web
      - run: docker push 127.0.0.1:5000/dial-ci/pg-web:test
      - run: echo "POSTGRES_RUNTIME_WEB_IMAGE=$(docker image inspect 127.0.0.1:5000/dial-ci/pg-web:test --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_postgres_runtime -v
        env:
          POSTGRES_RUNTIME_BACKUP: '1'
  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: docker run -d --name dial-ci-registry -p 127.0.0.1:5000:5000 registry:3
      - run: docker build -t 127.0.0.1:5000/dial-ci/web:test tests/fixtures/web
      - run: docker push 127.0.0.1:5000/dial-ci/web:test
      - run: echo "NODE_RUNTIME_TEST_IMAGE=$(docker image inspect 127.0.0.1:5000/dial-ci/web:test --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_docker_runtime -v
      - run: python -m unittest tests.test_ingress_runtime -v
        env:
          INGRESS_TEST_IMAGE: traefik:v3.5
  openbao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: python -m unittest tests.test_openbao_integration -v
        env:
          OPENBAO_TEST_IMAGE: openbao/openbao:2.6.0
      - run: python -m unittest tests.test_openbao_backup_runtime -v
        env:
          OPENBAO_TEST_IMAGE: openbao/openbao:2.6.0
  valkey-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: docker pull valkey/valkey:9
      - run: docker pull busybox:1.37.0-musl
      - run: |
          echo "VALKEY_RUNTIME_IMAGE=valkey/valkey:9@sha256:$(docker image inspect valkey/valkey:9 --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
          echo "VALKEY_BACKUP_SHELL_IMAGE=busybox:1.37.0-musl@sha256:$(docker image inspect busybox:1.37.0-musl --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
      - run: docker run -d --name dial-vk-ci-registry -p 127.0.0.1:5000:5000 registry:3
      - run: docker build -t 127.0.0.1:5000/dial-ci/vk-web:test tests/fixtures/web
      - run: docker push 127.0.0.1:5000/dial-ci/vk-web:test
      - run: echo "VALKEY_RUNTIME_WEB_IMAGE=$(docker image inspect 127.0.0.1:5000/dial-ci/vk-web:test --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_valkey_runtime -v
        env:
          VALKEY_RUNTIME_BACKUP: '1'
  storage-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install boto3==1.43.101
      - run: sudo apt-get update && sudo apt-get install -y restic
      - run: docker pull dxflrs/garage:v2.3.0
      - run: docker pull busybox:1.37.0-musl
      - run: |
          echo "STORAGE_RUNTIME_IMAGE=dxflrs/garage:v2.3.0@sha256:$(docker image inspect dxflrs/garage:v2.3.0 --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
          echo "STORAGE_SHELL_IMAGE=busybox:1.37.0-musl@sha256:$(docker image inspect busybox:1.37.0-musl --format '{{index .RepoDigests 0}}' | cut -d: -f2)" >> "$GITHUB_ENV"
      - run: docker run -d --name dial-s3-ci-registry -p 127.0.0.1:5000:5000 registry:3
      - run: docker build -t 127.0.0.1:5000/dial-ci/s3-web:test tests/fixtures/web
      - run: docker push 127.0.0.1:5000/dial-ci/s3-web:test
      - run: echo "STORAGE_RUNTIME_WEB_IMAGE=$(docker image inspect 127.0.0.1:5000/dial-ci/s3-web:test --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_storage_runtime -v
        env:
          STORAGE_RUNTIME_BACKUP: '1'
