name: Verify repository contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/packcheck.py
      - run: python -m pip install --requirement services/api/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q services/api tools
      - run: python -c 'import sys; sys.path.insert(0,"services/api"); import hosting_api.__main__'
