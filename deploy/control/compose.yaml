name: dial-hosting-control-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hosting
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin
    secrets: [pg_admin, pg_api, pg_worker, pg_admitter, pg_hook, pg_buildworker]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./00_create_api_role.sh:/docker-entrypoint-initdb.d/00_create_api_role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d hosting']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped
  migrate:
    build: ../../services/api
    command: [python, -m, hosting_api.migrate]
    environment:
      DB_HOST: db
      DB_NAME: hosting
      DB_USER: postgres
      DB_PASSWORD_FILE: /run/secrets/pg_admin
    secrets: [pg_admin]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    restart: 'no'
  api:
    build: ../../services/api
    environment:
      DB_HOST: db
      DB_NAME: hosting
      DB_USER: hosting_api
      DB_PASSWORD_FILE: /run/secrets/pg_api
      OIDC_ISSUER: ${OIDC_ISSUER:?Configure a real OIDC issuer}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Configure a dedicated API audience}
      OIDC_SERVICE_AUDIENCE: ${OIDC_SERVICE_AUDIENCE:?Configure a distinct service token audience}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Configure a real HTTPS JWKS URL}
    secrets: [pg_api]
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    restart: unless-stopped
  github-webhook:
    build: ../../services/api
    command: [python, -m, hosting_api.github_webhook]
    environment:
      DB_HOST: db
      DB_NAME: hosting
      DB_USER: hosting_hook
      DB_PASSWORD_FILE: /run/secrets/pg_hook
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook
    secrets: [pg_hook, github_webhook]
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8081:8081']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    restart: unless-stopped
networks:
  backend: {internal: true}
  egress: {}
volumes:
  pg_data: {}
secrets:
  pg_admin: {file: ./.secrets/pg_admin}
  pg_api: {file: ./.secrets/pg_api}
  pg_worker: {file: ./.secrets/pg_worker}
  pg_admitter: {file: ./.secrets/pg_admitter}
  pg_hook: {file: ./.secrets/pg_hook}
  pg_buildworker: {file: ./.secrets/pg_buildworker}
  github_webhook: {file: ./.secrets/github_webhook}
