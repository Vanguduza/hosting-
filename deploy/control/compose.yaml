name: dial-hosting-control-dev
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: hosting
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin
    secrets: [pg_admin, pg_api, pg_worker, pg_admitter, pg_hook, pg_buildworker]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./00_create_api_role.sh:/docker-entrypoint-initdb.d/00_create_api_role.sh:ro
      - ../../services/api/schema/001_control.sql:/docker-entrypoint-initdb.d/01_control.sql:ro
      - ../../services/api/schema/002_release.sql:/docker-entrypoint-initdb.d/02_release.sql:ro
      - ../../services/api/schema/003_domains.sql:/docker-entrypoint-initdb.d/03_domains.sql:ro
      - ../../services/api/schema/004_failed_cleanup.sql:/docker-entrypoint-initdb.d/04_failed_cleanup.sql:ro
      - ../../services/api/schema/005_postgres.sql:/docker-entrypoint-initdb.d/05_postgres.sql:ro
      - ../../services/api/schema/006_valkey.sql:/docker-entrypoint-initdb.d/06_valkey.sql:ro
      - ../../services/api/schema/007_team.sql:/docker-entrypoint-initdb.d/07_team.sql:ro
      - ../../services/api/schema/008_admission.sql:/docker-entrypoint-initdb.d/08_admission.sql:ro
      - ../../services/api/schema/009_github_builds.sql:/docker-entrypoint-initdb.d/09_github_builds.sql:ro
      - ../../services/api/schema/010_build_visibility.sql:/docker-entrypoint-initdb.d/10_build_visibility.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d hosting']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped
  api:
    build: ../../services/api
    environment:
      DB_HOST: db
      DB_NAME: hosting
      DB_USER: hosting_api
      DB_PASSWORD_FILE: /run/secrets/pg_api
      OIDC_ISSUER: ${OIDC_ISSUER:?Configure a real OIDC issuer}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Configure a dedicated API audience}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Configure a real HTTPS JWKS URL}
    secrets: [pg_api]
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8080:8080']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    restart: unless-stopped
  github-webhook:
    build: ../../services/api
    command: [python, -m, hosting_api.github_webhook]
    environment:
      DB_HOST: db
      DB_NAME: hosting
      DB_USER: hosting_hook
      DB_PASSWORD_FILE: /run/secrets/pg_hook
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook
    secrets: [pg_hook, github_webhook]
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8081:8081']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    restart: unless-stopped
networks:
  backend: {internal: true}
  egress: {}
volumes:
  pg_data: {}
secrets:
  pg_admin: {file: ./.secrets/pg_admin}
  pg_api: {file: ./.secrets/pg_api}
  pg_worker: {file: ./.secrets/pg_worker}
  pg_admitter: {file: ./.secrets/pg_admitter}
  pg_hook: {file: ./.secrets/pg_hook}
  pg_buildworker: {file: ./.secrets/pg_buildworker}
  github_webhook: {file: ./.secrets/github_webhook}
