services:
  event-worker:
    build: ../../services/api
    command: [python, -m, hosting_api.event_worker]
    environment:
      DB_HOST: db
      DB_NAME: hosting
      DB_USER: hosting_worker
      DB_PASSWORD_FILE: /run/secrets/pg_worker
      EVENT_SINK_URL: ${EVENT_SINK_URL:?Configure a verified HTTPS event receiver}
      EVENT_SINK_SECRET_FILE: /run/secrets/event_sink
    secrets: [pg_worker, event_sink]
    depends_on:
      migrate: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    restart: unless-stopped
secrets:
  event_sink: {file: ./.secrets/event_sink}
